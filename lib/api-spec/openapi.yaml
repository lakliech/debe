openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ushindi 2027 - Campaign Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: roles
    description: Role and permission management
  - name: geography
    description: Kenya administrative hierarchy
  - name: dashboard
    description: Dashboard summaries
  - name: config
    description: System configuration and branding
  - name: audit
    description: Audit log
  - name: public
    description: Public portal endpoints (no auth required)
  - name: volunteers
    description: Volunteer lifecycle management
  - name: supporters
    description: Supporter CRM
  - name: training
    description: Training courses and enrollments
  - name: coordinator
    description: Coordinator-level dashboards and field ops
  - name: dataRequests
    description: Data subject request (GDPR/DPA) workflow

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: countyId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get authenticated user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/roles:
    post:
      operationId: assignUserRole
      tags: [users]
      summary: Assign role to user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignment"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [users]
      summary: Suspend a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendInput"
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /roles/{id}/permissions:
    get:
      operationId: getRolePermissions
      tags: [roles]
      summary: Get permissions for a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    put:
      operationId: setRolePermissions
      tags: [roles]
      summary: Set permissions for a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionSet"
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /geography/counties:
    get:
      operationId: listCounties
      tags: [geography]
      summary: List all 47 counties
      responses:
        "200":
          description: Counties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/County"

  /geography/counties/{id}:
    get:
      operationId: getCounty
      tags: [geography]
      summary: Get county with detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: County detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountyDetail"

  /geography/constituencies:
    get:
      operationId: listConstituencies
      tags: [geography]
      summary: List constituencies
      parameters:
        - name: countyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Constituencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Constituency"

  /geography/wards:
    get:
      operationId: listWards
      tags: [geography]
      summary: List wards
      parameters:
        - name: constituencyId
          in: query
          schema:
            type: string
        - name: countyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Wards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ward"

  /geography/polling-centres:
    get:
      operationId: listPollingCentres
      tags: [geography]
      summary: List polling centres
      parameters:
        - name: wardId
          in: query
          schema:
            type: string
        - name: constituencyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Polling centres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PollingCentre"

  /geography/polling-stations:
    get:
      operationId: listPollingStations
      tags: [geography]
      summary: List polling stations
      parameters:
        - name: centreId
          in: query
          schema:
            type: string
        - name: wardId
          in: query
          schema:
            type: string
        - name: constituencyId
          in: query
          schema:
            type: string
        - name: countyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Polling stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PollingStation"

  /geography/stats:
    get:
      operationId: getGeographyStats
      tags: [geography]
      summary: Get geographic hierarchy stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyStats"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get executive dashboard summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/coverage:
    get:
      operationId: getCoverageSummary
      tags: [dashboard]
      summary: County-level campaign coverage data
      responses:
        "200":
          description: Coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountyCoverage"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/role-breakdown:
    get:
      operationId: getRoleBreakdown
      tags: [dashboard]
      summary: User counts grouped by role
      responses:
        "200":
          description: Role counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleCount"

  /config/branding:
    get:
      operationId: getBranding
      tags: [config]
      summary: Get campaign branding settings
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
    patch:
      operationId: updateBranding
      tags: [config]
      summary: Update campaign branding settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdate"
      responses:
        "200":
          description: Updated branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"

  /config/system:
    get:
      operationId: getSystemConfig
      tags: [config]
      summary: Get system configuration
      responses:
        "200":
          description: System config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfig"

  /audit/logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /public/stats:
    get:
      operationId: getPublicStats
      tags: [public]
      summary: Public portal statistics
      responses:
        "200":
          description: Portal stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /public/manifesto/sectors:
    get:
      operationId: listManifestoSectors
      tags: [public]
      summary: List manifesto sectors
      responses:
        "200":
          description: Manifesto sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManifestoSector"

  /public/manifesto/sectors/{slug}:
    get:
      operationId: getManifestoSector
      tags: [public]
      summary: Get manifesto sector by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sector detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestoSectorDetail"

  /public/county-priorities/{countyCode}:
    get:
      operationId: getCountyPriorities
      tags: [public]
      summary: Get priorities for a specific county
      parameters:
        - name: countyCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: County priorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountyPrioritiesResponse"

  /public/events:
    get:
      operationId: listPublicEvents
      tags: [public]
      summary: List published events
      parameters:
        - name: countyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicEvent"

  /public/news:
    get:
      operationId: listPublicNews
      tags: [public]
      summary: List published news
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: News articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /public/news/{slug}:
    get:
      operationId: getPublicNewsArticle
      tags: [public]
      summary: Get a news article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

  /public/faq:
    get:
      operationId: listFaqItems
      tags: [public]
      summary: List FAQ items
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: FAQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqItem"

  /public/fact-check:
    get:
      operationId: listFactCheckItems
      tags: [public]
      summary: List fact check items
      responses:
        "200":
          description: Fact checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactCheckItem"

  /public/volunteer-register:
    post:
      operationId: registerVolunteer
      tags: [public]
      summary: Self-register as a volunteer (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerRegistrationInput"
      responses:
        "201":
          description: Registration received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /public/supporter-register:
    post:
      operationId: registerSupporter
      tags: [public]
      summary: Self-register as a supporter (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupporterRegistrationInput"
      responses:
        "201":
          description: Registration received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /public/policy-submit:
    post:
      operationId: submitCitizenPolicy
      tags: [public]
      summary: Submit a citizen policy idea (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySubmissionInput"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /volunteers:
    get:
      operationId: listVolunteers
      tags: [volunteers]
      summary: List volunteers with filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: countyId
          in: query
          schema:
            type: string
        - name: constituencyId
          in: query
          schema:
            type: string
        - name: wardId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Volunteers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerListResponse"

  /volunteers/stats:
    get:
      operationId: getVolunteerStats
      tags: [volunteers]
      summary: Get volunteer status breakdown counts
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerStats"

  /volunteers/{id}:
    get:
      operationId: getVolunteer
      tags: [volunteers]
      summary: Get volunteer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"
    patch:
      operationId: updateVolunteer
      tags: [volunteers]
      summary: Update volunteer details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerUpdate"
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"

  /volunteers/{id}/verify:
    post:
      operationId: verifyVolunteer
      tags: [volunteers]
      summary: Mark volunteer as verified
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"

  /volunteers/{id}/approve:
    post:
      operationId: approveVolunteer
      tags: [volunteers]
      summary: Approve and activate volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignedRole:
                  type: string
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"

  /volunteers/{id}/reject:
    post:
      operationId: rejectVolunteer
      tags: [volunteers]
      summary: Reject volunteer application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"

  /volunteers/{id}/suspend:
    post:
      operationId: suspendVolunteer
      tags: [volunteers]
      summary: Suspend a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"

  /volunteers/{id}/badges:
    get:
      operationId: getVolunteerBadges
      tags: [volunteers]
      summary: Get badges awarded to a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Badge awards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeAward"
    post:
      operationId: awardVolunteerBadge
      tags: [volunteers]
      summary: Award a badge to a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - badgeId
              properties:
                badgeId:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Badge awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeAward"

  /volunteers/{id}/tasks:
    get:
      operationId: getVolunteerTasks
      tags: [volunteers]
      summary: Get task assignments for a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAssignment"

  /volunteers/{id}/attendance:
    get:
      operationId: getVolunteerAttendance
      tags: [volunteers]
      summary: Get attendance records for a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: markVolunteerAttendance
      tags: [volunteers]
      summary: Mark attendance for a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Attendance marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /volunteers/{id}/training:
    get:
      operationId: getVolunteerTraining
      tags: [volunteers]
      summary: Get training enrollments for a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Training enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingEnrollmentSummary"

  /supporters:
    get:
      operationId: listSupporters
      tags: [supporters]
      summary: List supporters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: countyId
          in: query
          schema:
            type: string
        - name: optedOut
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Supporters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterListResponse"

  /supporters/stats:
    get:
      operationId: getSupporterStats
      tags: [supporters]
      summary: Get supporter statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterStats"

  /supporters/{id}:
    get:
      operationId: getSupporter
      tags: [supporters]
      summary: Get supporter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supporter
          content:
            application/json:
              schema:
