components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    User:
      type: object
      required:
        - id
        - clerkId
        - email
        - fullName
        - roles
        - status
        - createdAt
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        status:
          type: string
          enum: [active, suspended, pending, inactive]
        countyId:
          type: ["string", "null"]
        constituencyId:
          type: ["string", "null"]
        wardId:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    UserRole:
      type: object
      required:
        - roleId
        - roleName
        - roleSlug
      properties:
        roleId:
          type: string
        roleName:
          type: string
        roleSlug:
          type: string
        countyId:
          type: ["string", "null"]
        constituencyId:
          type: ["string", "null"]
        wardId:
          type: ["string", "null"]

    UserInput:
      type: object
      required:
        - email
        - fullName
        - roleId
      properties:
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        roleId:
          type: string
        countyId:
          type: string
        constituencyId:
          type: string
        wardId:
          type: string

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        photoUrl:
          type: string
        status:
          type: string
        countyId:
          type: string
        constituencyId:
          type: string
        wardId:
          type: string

    RoleAssignment:
      type: object
      required:
        - roleId
      properties:
        roleId:
          type: string
        countyId:
          type: string
        constituencyId:
          type: string
        wardId:
          type: string

    SuspendInput:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string

    Role:
      type: object
      required:
        - id
        - name
        - slug
        - level
        - userCount
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        level:
          type: integer
        color:
          type: ["string", "null"]
        userCount:
          type: integer

    Permission:
      type: object
      required:
        - id
        - resource
        - action
      properties:
        id:
          type: string
        resource:
          type: string
        action:
          type: string
        scope:
          type: ["string", "null"]

    PermissionSet:
      type: object
      required:
        - permissionIds
      properties:
        permissionIds:
          type: array
          items:
            type: string

    County:
      type: object
      required:
        - id
        - code
        - name
        - constituencyCount
        - wardCount
      properties:
        id:
          type: string
        code:
          type: integer
        name:
          type: string
        capital:
          type: ["string", "null"]
        constituencyCount:
          type: integer
        wardCount:
          type: integer
        registeredVoters:
          type: ["integer", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]

    CountyDetail:
      type: object
      required:
        - id
        - code
        - name
        - constituencyCount
        - wardCount
        - pollingStationCount
      properties:
        id:
          type: string
        code:
          type: integer
        name:
          type: string
        capital:
          type: ["string", "null"]
        constituencyCount:
          type: integer
        wardCount:
          type: integer
        pollingStationCount:
          type: integer
        registeredVoters:
          type: ["integer", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        constituencies:
          type: array
          items:
            $ref: "#/components/schemas/Constituency"

    Constituency:
      type: object
      required:
        - id
        - code
        - name
        - countyId
        - countyName
        - wardCount
      properties:
        id:
          type: string
        code:
          type: integer
        name:
          type: string
        countyId:
          type: string
        countyName:
          type: string
        wardCount:
          type: integer
        registeredVoters:
          type: ["integer", "null"]

    Ward:
      type: object
      required:
        - id
        - code
        - name
        - constituencyId
        - constituencyName
        - countyId
        - countyName
      properties:
        id:
          type: string
        code:
          type: integer
        name:
          type: string
        constituencyId:
          type: string
        constituencyName:
          type: string
        countyId:
          type: string
        countyName:
          type: string
